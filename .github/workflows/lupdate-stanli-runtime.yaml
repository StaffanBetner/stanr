name: Update stanli runtime

on:
  workflow_dispatch:
  schedule:
    # Mondays at 05:23 UTC.
    - cron: "23 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-stanli-runtime
  cancel-in-progress: false

jobs:
  update:
    name: Update vendored stanli runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Resolve upstream stanli revision
        id: stanli
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(
            git ls-remote https://github.com/seantalts/stanli.git \
              refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream commit SHA: $upstream_sha" >&2
            exit 1
          fi

          current_ref="$(
            sed -nE \
              's/^STANLI_REF="([0-9a-f]{7,40})"$/\1/p' \
              tools/upgrade_stanli.sh
          )"

          if [[ ! "$current_ref" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Could not read STANLI_REF from tools/upgrade_stanli.sh" >&2
            exit 1
          fi

          short_sha="${upstream_sha:0:7}"

          if [[ "${upstream_sha:0:${#current_ref}}" == "$current_ref" ]]; then
            changed=false
            echo "stanli is already current at $current_ref"
          else
            changed=true
            echo "Updating stanli from $current_ref to $short_sha"
          fi

          {
            echo "sha=$upstream_sha"
            echo "short_sha=$short_sha"
            echo "current_ref=$current_ref"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

      - name: Update stanli runtime
        if: steps.stanli.outputs.changed == 'true'
        shell: bash
        env:
          STANLI_REF: ${{ steps.stanli.outputs.short_sha }}
        run: |
          set -euo pipefail

          sed -i -E \
            "s/^STANLI_REF=\"[0-9a-f]{7,40}\"$/STANLI_REF=\"$STANLI_REF\"/" \
            tools/upgrade_stanli.sh

          rm -rf tools/stanli-[0-9a-f]*

          (
            cd tools
            ./upgrade_stanli.sh
          )

          rm -rf tools/stanli-[0-9a-f]*

      - name: Validate generated runtime
        if: steps.stanli.outputs.changed == 'true'
        shell: bash
        env:
          STANLI_REF: ${{ steps.stanli.outputs.short_sha }}
        run: |
          set -euo pipefail

          grep -qx \
            "STANLI_REF=\"$STANLI_REF\"" \
            tools/upgrade_stanli.sh

          test -f src/stanli/LICENSE
          test -d src/stanli/runtime/include
          test -d src/stanli/runtime/src
          test -d src/stanli/runtime/kernels

          git diff --check

          unexpected_paths="$(
            git status --short |
              sed -E 's/^.. //' |
              grep -Ev '^(src/stanli/|tools/upgrade_stanli\.sh$)' ||
              true
          )"

          if [[ -n "$unexpected_paths" ]]; then
            echo "Unexpected files changed:" >&2
            printf '%s\n' "$unexpected_paths" >&2
            exit 1
          fi

          if git diff --quiet -- tools/upgrade_stanli.sh src/stanli; then
            echo "The upstream revision changed, but vendoring produced no diff."
          fi

      - name: Create or update pull request
        if: steps.stanli.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/update-stanli-runtime
          delete-branch: true
          add-paths: |
            tools/upgrade_stanli.sh
            src/stanli
          commit-message: >-
            chore: update stanli runtime to ${{ steps.stanli.outputs.short_sha }}
          title: >-
            Update stanli runtime to ${{ steps.stanli.outputs.short_sha }}
          body: |
            Updates the vendored stanli runtime from
            `${{ steps.stanli.outputs.current_ref }}` to
            `${{ steps.stanli.outputs.sha }}`.

            The files were generated by `tools/upgrade_stanli.sh`.

            Upstream repository: `seantalts/stanli`
            Upstream branch: `main`
          draft: false
